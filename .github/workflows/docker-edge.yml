name: Edge Docker Images

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push amd64 edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: philhawthorne/ha-dockermon:edge-x64

      - name: Build and push ARM64 edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.RaspberryPi
          platforms: linux/arm64/v8
          push: true
          tags: philhawthorne/ha-dockermon:edge-arm64

      - name: Build and push ARMv7 edge compatibility image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.RaspberryPiArmV7
          platforms: linux/arm/v7
          push: true
          tags: philhawthorne/ha-dockermon:edge-armv7

      - name: Create multi-platform ARM edge manifest
        run: >-
          docker buildx imagetools create
          --tag philhawthorne/ha-dockermon:edge-arm
          philhawthorne/ha-dockermon:edge-arm64
          philhawthorne/ha-dockermon:edge-armv7

      - name: Create multi-platform edge manifest
        run: >-
          docker buildx imagetools create
          --tag philhawthorne/ha-dockermon:edge
          philhawthorne/ha-dockermon:edge-x64
          philhawthorne/ha-dockermon:edge-arm
