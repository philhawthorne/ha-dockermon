name: Latest Docker Images

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: philhawthorne/ha-dockermon:x64

      - name: Build and push ARM images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.RaspberryPi
          platforms: linux/arm/v7,linux/arm64/v8
          push: true
          tags: |
            philhawthorne/ha-dockermon:arm
            philhawthorne/ha-dockermon:arm-latest

      - name: Create multi-platform latest manifest
        run: >-
          docker buildx imagetools create
          --tag philhawthorne/ha-dockermon:latest
          philhawthorne/ha-dockermon:x64
          philhawthorne/ha-dockermon:arm
