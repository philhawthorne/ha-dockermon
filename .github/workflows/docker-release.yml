name: Release Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: philhawthorne/ha-dockermon:${{ steps.release.outputs.tag }}-x64

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.RaspberryPi
          platforms: linux/arm64/v8
          push: true
          tags: philhawthorne/ha-dockermon:${{ steps.release.outputs.tag }}-arm64

      - name: Build and push ARMv7 compatibility image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.RaspberryPiArmV7
          platforms: linux/arm/v7
          push: true
          tags: philhawthorne/ha-dockermon:${{ steps.release.outputs.tag }}-armv7

      - name: Create multi-platform release manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "philhawthorne/ha-dockermon:${RELEASE_TAG}" \
            "philhawthorne/ha-dockermon:${RELEASE_TAG}-x64" \
            "philhawthorne/ha-dockermon:${RELEASE_TAG}-arm64" \
            "philhawthorne/ha-dockermon:${RELEASE_TAG}-armv7"
