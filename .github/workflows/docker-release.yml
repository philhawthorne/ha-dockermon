name: Release Docker Images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: philhawthorne/ha-dockermon:${{ github.event.release.tag_name }}-x64

      - name: Build and push ARM images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: philhawthorne/ha-dockermon:${{ github.event.release.tag_name }}-arm

      - name: Create multi-platform release manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "philhawthorne/ha-dockermon:${RELEASE_TAG}" \
            "philhawthorne/ha-dockermon:${RELEASE_TAG}-x64" \
            "philhawthorne/ha-dockermon:${RELEASE_TAG}-arm"
